<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio · Advanced features prototype</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,system-ui,sans-serif;--bg:#100d15;--panel:#1b1622;--soft:#241e2d;--line:#393040;--text:#f5effa;--muted:#b0a5bc;--accent:#c3a5ff;--mint:#8ee3bd;--radius:12px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-size:14px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button,input,select,textarea{border:1px solid var(--line);border-radius:9px;background:var(--soft)}button{min-height:40px;padding:8px 13px;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover{background:#302738}button:disabled{opacity:.4;cursor:not-allowed}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input,select,textarea{width:100%;min-height:42px;padding:9px 11px}input[type=checkbox]{width:19px;min-height:19px;accent-color:var(--accent)}input[type=range]{padding:0;accent-color:var(--accent)}label{display:grid;gap:8px;font-size:12px;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font:26px Georgia,serif}h2{font-size:22px;font-weight:600;letter-spacing:-.03em}h3{font-size:16px}p{color:var(--muted);line-height:1.6}.icon{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.muted{color:var(--muted)}.kicker{font-size:10px;letter-spacing:.15em;font-weight:700;color:var(--muted)}.row{display:flex;align-items:center;gap:10px}.spread{justify-content:space-between}.primary{background:var(--accent);border-color:var(--accent);color:#21172f;font-weight:650}.primary:hover{background:#d1baff}.quiet{background:transparent;border-color:transparent}.icon-button{width:40px;padding:8px}.app-header{height:68px;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;gap:26px}.brand{font:24px Georgia,serif}.brand span{color:var(--accent)}.demo{margin-left:auto;font-size:11px;border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--muted)}.workspace{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;padding:22px;max-width:1480px;margin:auto}.rail,.canvas{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.rail{padding:22px;display:flex;flex-direction:column;gap:24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field-stack{display:grid;gap:16px}.divider{border-top:1px solid var(--line);padding-top:22px}.advanced-entry{width:100%;justify-content:space-between}.pill-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.pill{border-color:#68517e;background:#32253f;border-radius:99px;color:#e2d1ff;font-size:12px;min-height:36px;padding:6px 12px}.pill.off{color:var(--muted);border-color:var(--line);background:transparent}.pill .icon{width:14px;height:14px}.stage{min-height:360px;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 70%,#322340 0,transparent 65%);border-bottom:1px solid var(--line)}.stage-symbol{font:90px Georgia,serif;color:#654d7d;margin-bottom:12px}.composer{padding:22px;display:grid;gap:15px}.composer textarea{min-height:100px;resize:vertical}.shell-note{font-size:12px;margin-top:10px}.dialog{padding:0;border:1px solid #51425e;border-radius:18px;background:var(--panel);color:var(--text);width:min(1080px,calc(100vw - 48px));max-width:none;height:min(760px,calc(100dvh - 56px));max-height:none;box-shadow:0 30px 120px #0009;overflow:hidden}.dialog::backdrop{background:#09060dbb;backdrop-filter:blur(5px)}.modal-inner{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}.modal-header{padding:23px 26px 18px;display:flex;justify-content:space-between;gap:14px;align-items:start}.modal-header p{font-size:12px;margin-top:6px}.modal-tools{padding:0 26px 18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;border-bottom:1px solid var(--line)}.search{position:relative}.search .icon{position:absolute;top:12px;left:12px;color:var(--muted)}.search input{padding-left:39px;background:var(--bg)}.views{display:flex;gap:3px;padding:3px;background:var(--bg);border-radius:10px}.views button{min-height:34px;padding:6px 12px;border:0;background:transparent;color:var(--muted);font-size:12px}.views button[aria-pressed=true]{background:var(--soft);color:var(--text)}.modal-body{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0}.browser{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#17121e}.category{padding:16px 16px 12px}.category select{background:transparent;font-size:12px}.list-heading{padding:4px 18px 12px;font-size:11px;color:var(--muted)}.feature-list{overflow:auto;padding:0 8px 14px;min-height:0}.feature{display:flex;align-items:center;width:100%;padding:13px 10px;border:1px solid transparent;background:transparent;border-radius:9px;justify-content:start;gap:12px;text-align:left;margin-bottom:3px}.feature[aria-current=true]{background:#30243d;border-color:#644c7e}.feature>.icon{color:var(--accent)}.feature-copy{min-width:0;flex:1;display:grid;gap:5px}.feature b{font-size:12px;font-weight:600}.feature small{font-size:10px;color:var(--muted)}.tiny-pin{color:var(--accent);font-size:13px}.sent-dot{width:6px;height:6px;border-radius:50%;background:var(--mint);flex:none}.detail{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;min-width:0}.detail-scroll{overflow:auto;padding:26px 30px}.breadcrumb{font-size:11px;color:var(--muted);margin-bottom:20px}.feature-heading{display:flex;align-items:start;gap:12px}.feature-emblem{padding:12px;background:#322640;border-radius:12px;color:var(--accent);display:grid;place-items:center}.feature-emblem .icon{width:23px;height:23px}.feature-heading p{font-size:12px;margin-top:7px}.heading-copy{flex:1;min-width:0}.pin-button[aria-pressed=true]{color:var(--accent);background:#322640;border-color:#644c7e}.status-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0;font-size:11px}.badge{background:var(--soft);border-radius:5px;padding:5px 8px;color:var(--muted)}.badge.sent{color:var(--mint);background:#19312b}.enable-row{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 0;gap:12px;margin-bottom:22px}.enable-row label{display:flex;align-items:center;color:var(--text);font-weight:600;font-size:13px;gap:10px}.enable-row small{font-size:11px;color:var(--muted)}.fields{display:grid;gap:20px}.fields .grid2{gap:18px}.field-caption{display:flex;justify-content:space-between;align-items:center}.field-caption button{min-height:24px;font-size:10px;padding:2px 6px;color:var(--accent);background:transparent;border:0}.hint{font-size:11px;margin-top:-12px}.notice{margin-top:22px;display:flex;align-items:start;gap:9px;color:var(--muted);font-size:11px;line-height:1.6}.notice .icon{width:15px;height:15px;margin-top:2px;color:var(--accent)}.detail-footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;justify-content:space-between;background:#1b1622}.footer-copy{font-size:11px;line-height:1.5;color:var(--muted)}.footer-actions{display:flex;gap:8px;flex-wrap:wrap}.remove{color:#ffb6ca;background:transparent;font-size:12px}.empty{padding:25px 14px;font-size:12px;color:var(--muted);line-height:1.6}.mobile-back{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:13px 18px;background:#33273f;border:1px solid #705588;border-radius:12px;font-size:12px;box-shadow:0 10px 40px #0006;z-index:20}.toast:empty{display:none}.browse-result{margin-bottom:10px}.readout{font-variant-numeric:tabular-nums;color:var(--text)}
@media(max-width:700px){.app-header{padding:0 16px;gap:12px}.app-header>.muted{display:none}.workspace{grid-template-columns:1fr;padding:12px}.rail{padding:18px}.stage{min-height:220px}.dialog{width:100vw;height:100dvh;border:0;border-radius:0}.modal-header{padding:18px 16px 14px}.modal-header h2{font-size:21px}.modal-tools{padding:0 16px 14px;grid-template-columns:1fr;gap:10px}.views button{flex:1;min-height:40px}.modal-body{grid-template-columns:1fr}.browser{border:0}.detail{display:none}.dialog.editing .browser{display:none}.dialog.editing .detail{display:grid}.dialog.editing .modal-tools{display:none}.mobile-back{display:inline-flex;margin-bottom:18px;padding-left:0;color:var(--accent)}.detail-scroll{padding:16px 20px}.detail-footer{padding:14px 16px;align-items:start;flex-direction:column}.footer-actions{width:100%;justify-content:flex-end}.footer-copy{font-size:10px}.feature{padding:16px 12px;min-height:68px}.feature b{font-size:14px}.feature small{font-size:12px}.modal-header p{max-width:260px}.feature-heading{gap:10px}.feature-emblem{padding:10px}.heading-copy h2{font-size:20px}.enable-row{align-items:start}.enable-row small{max-width:145px;text-align:right}.grid2{gap:10px}.feature-list{padding-inline:10px}.category{padding:12px 20px}.list-heading{padding-left:22px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .12s ease,border-color .12s ease}}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="icon-sliders" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
<symbol id="icon-sparkles" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></symbol>
<symbol id="icon-pin" viewBox="0 0 24 24"><path d="m16 3 5 5-4 1-3 5v3l-3-1-6 6m6-6-4-4h3l5-3Z"/></symbol>
<symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
<symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
<symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="icon-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1"/><path d="m3 17 6-6 5 5 3-3 4 4"/></symbol>
<symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 10h18M10 3v18"/></symbol>
<symbol id="icon-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4m10 0h4M3 15h4m10 0h4"/></symbol>
<symbol id="icon-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4m6-4v4M9 18v4m6-4v4M2 9h4m-4 6h4m12-6h4m-4 6h4"/></symbol>
</defs></svg>
<header class="app-header"><div class="brand"><span>✦</span> Swarm Studio</div><span class="muted">Create</span><span class="demo">INTERACTIVE PROTOTYPE · MOCK DATA</span></header>
<main class="workspace">
 <aside class="rail"><div><div class="kicker">GENERATION</div><h1>Controls</h1></div><label>Checkpoint<select><option>Anima · portrait merge</option><option>SDXL · base</option></select></label><div class="grid2"><label>Steps<input type="number" value="24" min="1"></label><label>CFG<input type="number" value="5" step=".1"></label></div><label>Sampler<select><option>Euler</option><option>DPM++ 2M</option></select></label><div class="grid2"><label>Width<input type="number" value="1024"></label><label>Height<input type="number" value="1024"></label></div>
 <section class="divider"><button class="advanced-entry" id="open-advanced"><span class="row"><svg class="icon"><use href="#icon-sliders"/></svg>Advanced features</span><span>↗</span></button><div id="studio-pills" class="pill-list"></div><p class="shell-note" id="studio-caption"></p></section></aside>
 <section class="canvas"><div class="stage"><div><div class="stage-symbol">✧</div><h1>Room to experiment.</h1><p>Keep everyday controls close. Bring in more when you need them.</p></div></div><div class="composer"><label>Prompt<textarea>A quiet observatory, lavender dusk, delicate cinematic light</textarea></label><div class="row spread"><span class="muted" style="font-size:12px">Demo workspace</span><button class="primary" id="generate">Preview request <svg class="icon"><use href="#icon-sparkles"/></svg></button></div></div></section>
</main>
<dialog class="dialog" id="advanced" aria-labelledby="dialog-title"><div class="modal-inner">
 <header class="modal-header"><div><div class="kicker" style="margin-bottom:7px">SWARM STUDIO</div><h2 id="dialog-title">Advanced features</h2><p>Explore more controls. Send what you need to Studio.</p></div><button class="quiet icon-button" id="close-modal" aria-label="Close Advanced"><svg class="icon"><use href="#icon-close"/></svg></button></header>
 <div class="modal-tools"><label class="search"><span hidden>Search features and controls</span><svg class="icon"><use href="#icon-search"/></svg><input id="search" aria-label="Search features and controls" placeholder="Search features, controls, or parameter IDs…"></label><div class="views" role="group" aria-label="Catalog view"><button data-view="Pinned" aria-pressed="false">Pinned</button><button data-view="In Studio" aria-pressed="false">In Studio</button><button data-view="Browse" aria-pressed="true">Browse</button></div></div>
 <div class="modal-body"><aside class="browser"><label class="category">Browse by workflow<select id="category"><option>All workflows</option><option>Guidance & references</option><option>Refine & upscale</option><option>Image input & editing</option><option>Sampling & conditioning</option><option>Model components</option><option>Video</option><option>Performance & backend</option></select></label><div class="list-heading" id="list-heading"></div><div class="feature-list" id="feature-list"></div></aside><section class="detail" id="detail" aria-label="Feature settings"></section></div>
</div></dialog>
<div class="toast" role="status" id="toast"></div>
<script>
(() => {
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#icon-${n}"/></svg>`;
const features=[
 {id:'refiner',name:'Refine & upscale',category:'Refine & upscale',icon:'sparkles',desc:'Add a second pass for finer detail, a larger image, or both.',server:'Refine / Upscale',fields:[['model','Refiner model','select','Use base checkpoint',['Use base checkpoint','SDXL · refiner','Anima · detail merge']],['method','Refiner method','select','Post-apply',['Post-apply','Step swap','Step swap no noise']],['strength','Refine control percentage','range',.2],['scale','Upscale factor','number',1.5],['upscaler','Upscale method','select','Latent (bicubic)',['Latent (bicubic)','4x-UltraSharp','Lanczos']],['tiling','Use tiling','check',false]]},
 {id:'controlnet',name:'ControlNet',category:'Guidance & references',icon:'grid',desc:'Guide composition with edges, depth, or pose. Each slot keeps its own settings.',server:'ControlNet',fields:[['slot','Control slot','select','Slot 1',['Slot 1','Slot 2','Slot 3']],['type','Guidance type','select','Canny edges',['Canny edges','Depth','OpenPose']],['source','Reference image','select','Current init image',['Current init image','Demo · architectural study']],['strength','Control strength','range',.65],['end','End at','range',.8]]},
 {id:'imageprompt',name:'Image prompting',category:'Guidance & references',icon:'image',desc:'Use a reference to influence style and visual identity.',server:'Image Prompting',fields:[['source','Reference image','select','Demo · style reference',['Demo · style reference','Current init image']],['strength','Reference strength','range',.6],['mode','Reference mode','select','Style',['Style','Composition','Balanced']]]},
 {id:'seedvr',name:'SeedVR upscale',category:'Refine & upscale',icon:'sparkles',desc:'Explore a dedicated restoration and upscale stage.',server:'SeedVR',fields:[['scale','Upscale factor','number',2],['seed','Seed','number',-1],['tiled','Use tiled processing','check',true]]},
 {id:'initextras',name:'Init image extras',category:'Image input & editing',icon:'image',desc:'Additional controls for image-to-image generation. The image and creativity stay in Studio.',server:'Init Image',fields:[['noise','Extra noise','range',0],['reset','Reset to normalized latent','check',false]]},
 {id:'sampling',name:'Sampling extras',category:'Sampling & conditioning',icon:'sliders',desc:'Fine-tune the denoising process beyond the everyday sampler controls.',server:'Sampling',fields:[['eta','Eta','number',0],['churn','Sigma churn','number',0]]},
 {id:'components',name:'VAE & text encoders',category:'Model components',icon:'chip',desc:'Override individual model components for this generation.',server:'Model Loading',fields:[['vae','VAE','select','Server default',['Server default','Demo · SDXL VAE']],['clip','CLIP skip','number',1]]},
 {id:'video',name:'Image to video',category:'Video',icon:'film',desc:'Set up motion generation using an image as the starting frame.',server:'Image To Video',fields:[['frames','Frame count','number',49],['fps','Frames per second','number',16],['motion','Motion strength','range',.5]]},
 {id:'backend',name:'Precision & caching',category:'Performance & backend',icon:'chip',desc:'Explore runtime tradeoffs for memory and generation speed.',server:'Swarm Internal',fields:[['precision','Weight precision','select','Server default',['Server default','FP16','BF16']],['cache','Enable TeaCache','check',false]]}
];
const common=[{name:'Steps',location:'Controls',terms:'steps sampling'},{name:'Sampler',location:'Controls',terms:'sampler scheduler sampling'},{name:'Init image',location:'Controls',terms:'init image creativity'},{name:'Checkpoint',location:'Model & stack',terms:'model checkpoint'},{name:'LoRA stack',location:'Model & stack',terms:'lora weights'}];
const byId=id=>features.find(f=>f.id===id), defaults=f=>Object.fromEntries(f.fields.map(x=>[x[0],x[3]]));
let selected='refiner',view='Browse',pins=new Set(['refiner','controlnet']),sent={controlnet:{enabled:true,values:defaults(byId('controlnet'))}},drafts={},opener=null,timer;
const modal=document.querySelector('#advanced'),detail=document.querySelector('#detail'),search=document.querySelector('#search'),category=document.querySelector('#category');
const esc=v=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function draft(f){return drafts[f.id]??=(sent[f.id]?structuredClone(sent[f.id]):{enabled:true,values:defaults(f)});}
function toast(text){document.querySelector('#toast').textContent=text;clearTimeout(timer);timer=setTimeout(()=>document.querySelector('#toast').textContent='',3800);}
function renderPills(){document.querySelector('#studio-pills').innerHTML=Object.entries(sent).map(([id,s])=>`<button class="pill ${s.enabled?'':'off'}" data-pill="${id}" title="From Advanced · edit ${byId(id).name}">${icon(byId(id).icon)}${esc(byId(id).name)}${s.enabled?'':' · Off'}<span aria-hidden="true">↗</span></button>`).join('');document.querySelector('#studio-caption').textContent=Object.keys(sent).length?'From Advanced · select a pill to edit':'No additional features. Browse Advanced to add one.';}
function renderList(){const q=search.value.trim().toLowerCase(),cat=category.value;const filtered=features.filter(f=>(view!=='Pinned'||pins.has(f.id))&&(view!=='In Studio'||sent[f.id])&&(cat==='All workflows'||f.category===cat)&&(!q||[f.name,f.category,f.server,...f.fields.flatMap(x=>x.slice(0,2))].join(' ').toLowerCase().includes(q)));
document.querySelector('#list-heading').textContent=`${view} · ${filtered.length} features`;
document.querySelector('#feature-list').innerHTML=filtered.map(f=>`<button class="feature" data-feature="${f.id}" aria-current="${selected===f.id}">${icon(f.icon)}<span class="feature-copy"><b>${f.name}</b><small>${sent[f.id]?(sent[f.id].enabled?'Enabled in Studio':'In Studio · off'):f.category}</small></span>${pins.has(f.id)?'<span class="tiny-pin" aria-label="Pinned">⌖</span>':''}${sent[f.id]?.enabled?'<span class="sent-dot" aria-label="Enabled in Studio"></span>':''}</button>`).join('')+(!filtered.length?'<p class="empty">No features here yet. Try another search or switch to Browse.</p>':'')+(q?common.filter(c=>(c.name+' '+c.terms).toLowerCase().includes(q)).map(c=>`<button class="feature browse-result" data-common="${c.name}">${icon('sliders')}<span class="feature-copy"><b>${c.name}</b><small>Already in Studio · ${c.location}</small></span>↗</button>`).join(''):'');}
function fieldMarkup(f,x){const [key,label,type,,options]=x,v=draft(f).values[key],id='field-'+key;let input;if(type==='select')input=`<select id="${id}" data-field="${key}">${options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(type==='check')input=`<input id="${id}" type="checkbox" data-field="${key}" ${v?'checked':''}>`;else input=`<input id="${id}" type="${type}" data-field="${key}" value="${v}" ${type==='range'?'min="0" max="1" step=".01"':'step="any"'}>`;return `<div><div class="field-caption"><label for="${id}">${label}${type==='range'?` <span class="readout" data-readout="${key}">${Number(v).toFixed(2)}</span>`:''}</label><button data-reset="${key}" aria-label="Reset ${label}">Reset</button></div><div style="margin-top:8px">${input}</div></div>`;}
function renderDetail(){const f=byId(selected),s=draft(f),isSent=!!sent[f.id];detail.innerHTML=`<div class="detail-scroll"><button class="quiet mobile-back" data-back>‹ All features</button><div class="breadcrumb">${f.category} <span style="padding:0 7px">/</span> ${f.name}</div><div class="feature-heading"><div class="feature-emblem">${icon(f.icon)}</div><div class="heading-copy"><h2>${f.name}</h2><p>${f.desc}</p></div><button class="icon-button pin-button" data-pin aria-label="${pins.has(f.id)?'Unpin':'Pin'} ${f.name}" aria-pressed="${pins.has(f.id)}" title="Pin in Advanced">${icon('pin')}</button></div><div class="status-line"><span class="badge ${isSent?'sent':''}">${isSent?'From Advanced · in Studio':'Not in Studio yet'}</span><span class="muted">${f.fields.length} controls</span></div><div class="enable-row"><label><input type="checkbox" id="feature-enabled" ${s.enabled?'checked':''}>Enable feature</label><small>${s.enabled?'Included when sent to Studio':'Retain settings without running this feature'}</small></div><div class="fields">${f.fields.map(x=>fieldMarkup(f,x)).join('')}</div><div class="notice">${icon('sliders')}<span>${f.id==='initextras'?'Image upload and creativity stay in the common Studio layout. These are additional options.':'Studio’s everyday controls stay in place. These settings add an optional feature surface.'}</span></div></div><footer class="detail-footer"><div class="footer-copy">${isSent?'Update the existing Studio pill.':'Adds a compact pill to Studio.'}<br>Edits apply only when you send.</div><div class="footer-actions">${isSent?'<button class="remove" data-remove>Remove from Studio</button>':''}<button class="primary" data-send>${isSent?'Update Studio':'Send to Studio'} ${icon('arrow')}</button></div></footer>`;}
function render(){renderList();renderDetail();renderPills();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));}
function openAdvanced(id,trigger){selected=id||selected;opener=trigger||document.querySelector('#open-advanced');drafts={};render();if(id)modal.classList.add('editing');else modal.classList.remove('editing');modal.showModal();if(id)detail.querySelector('[data-pin]').focus();else search.focus();}
function closeAdvanced(){modal.close();drafts={};(opener?.isConnected?opener:document.querySelector('#open-advanced')).focus();}
document.querySelector('#open-advanced').onclick=e=>openAdvanced(null,e.currentTarget);
document.querySelector('#close-modal').onclick=closeAdvanced;
modal.addEventListener('cancel',e=>{e.preventDefault();closeAdvanced();});
modal.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.feature){selected=b.dataset.feature;renderList();renderDetail();modal.classList.add('editing');detail.querySelector('[data-back]').focus();}if(b.dataset.view){view=b.dataset.view;category.value='All workflows';renderList();document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));}if(b.hasAttribute('data-pin')){pins.has(selected)?pins.delete(selected):pins.add(selected);renderList();renderDetail();detail.querySelector('[data-pin]').focus();}if(b.hasAttribute('data-back')){modal.classList.remove('editing');document.querySelector(`[data-feature="${selected}"]`)?.focus();}if(b.dataset.reset){const f=byId(selected);draft(f).values[b.dataset.reset]=f.fields.find(x=>x[0]===b.dataset.reset)[3];renderDetail();document.querySelector('#field-'+b.dataset.reset)?.focus();}if(b.hasAttribute('data-send')){const invalid=Array.from(detail.querySelectorAll('input')).find(x=>!x.checkValidity());if(invalid){invalid.reportValidity();return;}sent[selected]=structuredClone(draft(byId(selected)));renderPills();opener=document.querySelector(`[data-pill="${selected}"]`);closeAdvanced();toast(`${byId(selected).name} ${sent[selected].enabled?'enabled':'saved as off'} in Studio.`);}if(b.hasAttribute('data-remove')){delete sent[selected];delete drafts[selected];render();toast('Removed from Studio. Feature settings will no longer be sent.');}if(b.dataset.common){closeAdvanced();toast(`${b.dataset.common} already lives in Studio. No duplicate was added.`);}});
detail.addEventListener('input',e=>{const el=e.target;if(el.id==='feature-enabled'){draft(byId(selected)).enabled=el.checked;const focus=el.id;renderDetail();document.getElementById(focus).focus();}if(el.dataset.field){draft(byId(selected)).values[el.dataset.field]=el.type==='checkbox'?el.checked:el.type==='number'||el.type==='range'?Number(el.value):el.value;const output=detail.querySelector(`[data-readout="${el.dataset.field}"]`);if(output)output.textContent=Number(el.value).toFixed(2);}});
search.oninput=renderList;category.onchange=renderList;
document.querySelector('#studio-pills').onclick=e=>{const b=e.target.closest('[data-pill]');if(b)openAdvanced(b.dataset.pill,b);};
document.querySelector('#generate').onclick=()=>toast('Demo request: '+(Object.entries(sent).filter(([,s])=>s.enabled).map(([id])=>byId(id).name).join(', ')||'common Studio controls only')+'. No generation is run.');
render();
})();
</script>
</body></html>
